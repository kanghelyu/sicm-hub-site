   {by:'chen',date:'2026-09-04',ver:'v2',media:{zh:'🎥 视频讲解 42:17',en:'🎥 Video walkthrough 42:17'},text:{zh:'投稿人声明「纯 AI 解决 · 本人完全不理解」，所以我的任务不是审它，而是把它完整讲给人类听——这就是评论员在新体系里的位置：AI 与人类之间的翻译者。\n先说结构：AI 证明了 type Aₙ、q 为奇数阶根的情形。第 3.1 节的基变换是全文的技术核心——它把 Lusztig 整形式上的结论搬到 k 上，这一步原稿跳了细节，v3 里 PR #12 补全（仿 Lusztig Prop. 19.3.7 的手法），我在视频 15:20–22:40 逐行讲了这段，为什么平坦性只用在循环模上、为什么这就够。\n第 4.2 节只对奇数阶根成立：q 为偶数阶根时中心里会出现额外的「幽灵中心元」，AI 的论证在这个参数带会失效——我在视频里给了一个具体的反例框架，展示失效发生在哪一步。\n面向想接手的人：问题 box 的 Q3 是我认为最有价值的切入点，从参数化 Weyl 群特征标入手可以绕开整块基变换。',en:'The submitter declared “pure AI — I do not understand it”, so my task is not to referee it but to explain it fully to humans — that is the commentator’s place in the new system: a translator between the AI and the humans.\nStructure first: the AI proved the type-Aₙ, odd-order-root case. The base change in §3.1 is the technical heart — it transports the statement from the Lusztig integral form down to k. The original draft skipped the details; PR #12 (merged in v3) filled them in, mirroring Lusztig Prop. 19.3.7. I walk through that argument line by line at 15:20–22:40 of the video: why flatness is only needed on cyclic modules, and why that is enough.\n§4.2 holds only for odd-order roots: when q has even order, the center picks up extra “ghost central elements” and the AI’s argument breaks in that range — I give a concrete counterexample framework in the video showing exactly where it fails.\nFor anyone who wants to take this up: Q3 in the problem box is in my view the most valuable entry point — starting from parameterized Weyl-group characters avoids the whole base-change package.'},qbox:[{zh:'Q1：补全引理 3.1 中 ⊗A → ⊗k 的基变换细节（提示：仿 Lusztig Prop. 19.3.7 的手法）。',en:'Q1: Fill in the base-change details ⊗A → ⊗k in Lemma 3.1 (hint: mirror the technique of Lusztig Prop. 19.3.7).'},{zh:'Q2：命题 4.2 请收窄到奇数阶根情形，或补充偶数阶论证。',en:'Q2: Narrow Proposition 4.2 to odd-order roots, or supply the even-order argument.'}]},
   {by:'petrov',date:'2026-09-06',ver:'v3',media:{zh:'📄 文章评论',en:'📄 Article commentary'},text:{zh:'这是对陈教授视频讲解的链式跟进（引用 Q1/Q2），沿同一思路继续把这份纯 AI 稿件拆给人类。\nQ1（基变换细节）已由 PR #12 解决并合入 v3：我把补全后的证明与陈教授的视频逐段核对了一遍，结论是成立，正文第 2 节给出了核对清单。\nQ2（收窄到奇数阶根）已在当前摘要体现。剩下的是我提出的新方向：偶数阶情形的「幽灵中心元」应当有纯组合的刻画——我猜测它与参数化 Weyl 群特征标的稳定化子有关，正文给出三步验证计划，第一步可以直接在现有 Lean 骨架上补。\n疑点未决数：1（Q3）。',en:'A chained follow-up to Prof. Chen’s video walkthrough (referencing Q1/Q2), continuing to unpack this pure-AI submission for humans along the same lines.\nQ1 (base-change details) was resolved by PR #12 and merged into v3: I checked the completed proof segment by segment against the video — it holds; §2 of this article gives the checklist.\nQ2 (narrowing to odd-order roots) is now reflected in the current abstract. What remains is a new direction of mine: the ghost central elements in even order should admit a purely combinatorial characterization — my guess is that they relate to stabilizers of parameterized Weyl-group characters. The article lays out a three-step verification plan; step one can be added directly on the existing Lean skeleton.\nOpen suspicions: 1 (Q3).'},qbox:[{zh:'Q3：偶数阶根情形的中心元构造——建议从参数化 Weyl 群特征标入手。',en:'Q3: Center-element construction for even-order roots — start from parameterized Weyl group characters.'}]}],

   {by:'kong',date:'2026-09-07',ver:'v1',media:{zh:'🎥 视频讲解 51:40',en:'🎥 Video walkthrough 51:40'},text:{zh:'投稿人声明「纯 AI · 本人完全不理解」——这类稿子正是评论员体系存在的理由：我来当 AI 与人类之间的翻译，把这份框架完整讲清楚。\n这份三步框架实际在说什么：第一步（已通过 Lean 编译）断言控制经典 Duflo 比较映射的形变复形在 Weyl 代数上是形式的；第二步在交换子展开处失败——Lean 把失败定位到第 47 行依赖的一条未证结合律恒等式；第三步（到量子情形的提升）整个悬空，AI 自己也承认只给了提纲。\n我在视频里做了三件事：用 20 分钟从 PBW 框架把第一步讲到能读；用一个具体的低阶反例演示第二步的恒等式为什么不自动成立；最后给出如果由人来接手，第三步应该从形变量子化的哪一端切入。\n结论：作为「解决框架」的标签是诚实的。接手价值集中在第二步那条恒等式——它很可能是一个可以独立形式化进 Mathlib 的引理。',en:'The submitter declared “pure AI — I do not understand it”. This kind of submission is exactly why the commentator system exists: I act as the translator between the AI and the humans, and explain this framework in full.\nWhat this three-step framework actually says: Step I (compiles in Lean) asserts that the deformation complex governing the classical Duflo comparison is formal over the Weyl algebra; Step II fails at the commutator expansion — Lean pins the failure down to an unproved associativity identity at line 47; Step III (the lift to the quantum case) is entirely hanging — the AI itself concedes it only gives an outline.\nThe video does three things: I spend 20 minutes building up from the PBW framework until Step I is readable; I use a concrete low-order counterexample to show why the Step II identity does not hold automatically; and I close with where a human should enter Step III if they take it over — which end of the deformation quantization to start from.\nVerdict: the “solution framework” tag is honest. The takeover value is concentrated in the Step II identity — quite likely a lemma that can be independently formalized into Mathlib.'},qbox:[{zh:'Q1：补证引理 3.4 的结合律恒等式（Lean 失败点已定位到行级）。',en:'Q1: Prove the missing associativity identity in Lemma 3.4 (the Lean failure is localized to the line level).'}]},
   {by:'petrov',date:'2026-09-09',ver:'v1',media:{zh:'📄 文章评论',en:'📄 Article commentary'},text:{zh:'对孔教授视频讲解的链式跟进（引用 Q1）：我把第二步那条未证的结合律恒等式拆成了三个更弱的子断言，正文逐一给出证明骨架。\n子断言 (a) 与 (c) 可以在 Mathlib 现有 API 上直接拼出，我附了完整的 Lean 化路线图；(b) 是真正的新内容——它等价于一个低阶的组合恒等式，我在附录里做到了 n ≤ 4 的手算验证。\n接手建议：从 (b) 开始，它不依赖任何未证内容，且单独成立就足以让第二步的展开在低阶情形闭合。\n疑点未决数：1（Q1 整体仍开放，但已拆分为可独立接手的三个子问题）。',en:'A chained follow-up to Prof. Kong’s video walkthrough (referencing Q1): I split the unproved associativity identity of Step II into three weaker sub-assertions and give a proof skeleton for each.\nSub-assertions (a) and (c) assemble directly from existing Mathlib API — I attach a complete Lean-ification roadmap; (b) is the genuinely new content — it is equivalent to a low-order combinatorial identity, hand-checked to n ≤ 4 in the appendix.\nTakeover advice: start from (b); it depends on nothing unproved, and alone it already closes the Step II expansion in low order.\nOpen suspicions: 1 (Q1 remains open overall, but is now split into three independently adoptable sub-problems).'},qbox:[{zh:'Q2：把子断言 (b) 形式化进 Mathlib（预计 200 行以内，无新依赖）。',en:'Q2: Formalize sub-assertion (b) into Mathlib (under ~200 lines, no new dependencies).'}]}],

const LS='sicmhub_state_v3';
let S=JSON.parse(localStorage.getItem(LS)||'{}');
S.lang=S.lang||'en';S.cur=S.cur||'liu';
S.newIssues=S.newIssues||[];S.prStatus=S.prStatus||{};S.comments=S.comments||{};S.private=S.private||{};S.newRepos=S.newRepos||[];S.stars=S.stars||{};S.takes=S.takes||{};S.repoIssues=S.repoIssues||{};{const _d=new Date().toISOString().slice(0,10);S.cp=S.cp&&S.cp.day===_d?S.cp:{day:_d,n:0};}
function save(){localStorage.setItem(LS,JSON.stringify(S));}
function allRepos(){return [...S.newRepos,...REPOS];}
function getRepo(id){return allRepos().find(r=>r.id===id);}
function prStatus(r,pr){return S.prStatus[r.id+pr.id]||pr.status;}
function repoDiscussion(r){return S.private[r.id]||r.discussion;}
function repoComments(r){return [...(S.comments[r.id]||[]),...r.comments];}
function allIssues(){return [...S.newIssues,...ISSUES];}
/* ================== Utils & i18n helpers ================== */
const d=v=>v&&typeof v==='object'?(S.lang in v?v[S.lang]:v.en):(v==null?'':v);

const isCm=()=>/Commentator|评论员/.test(d(USERS[S.cur].role));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){route();}

/* ================== Routing ================== */
function route(){
  renderNav();
  const h=location.hash||'#/';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  let m;
  if(h==='#/'||h==='#'){renderHome();nav('home');}
  else if(h==='#/repos'){renderRepos();nav('repos');}
  else if(m=h.match(/^#\/repo\/(\w+)/)){renderRepo(m[1]);nav('repos');}
  else if(h==='#/issues'){renderIssues();nav('issues');}
  else if(h==='#/submit'){renderSubmit();nav('submit');}
  else if(h==='#/commentators'){renderCommentators();nav('commentators');}
  else if(m=h.match(/^#\/user\/(\w+)/)){renderUser(m[1]);nav('');}
  else if(h==='#/about'){renderAbout();nav('about');}
  else {renderHome();nav('home');}
  window.scrollTo(0,0);
}

function vToggle(cid,sec){
  const p=PLAY[cid]||(PLAY[cid]={t:0,iv:null});
  const stage=document.getElementById('vs-'+cid),big=document.getElementById('vb-'+cid);
  if(!stage||!big)return;
  if(p.iv){clearInterval(p.iv);p.iv=null;stage.classList.remove('playing');big.textContent='▶';return;}
  if(p.t>=sec-1)p.t=0;
  stage.classList.add('playing');big.textContent='❚❚';
  p.iv=setInterval(()=>{
    if(!document.getElementById('vs-'+cid)){clearInterval(p.iv);p.iv=null;return;}
    p.t=Math.min(sec,p.t+20);
    const bar=document.getElementById('pb-'+cid),tc=document.getElementById('tc-'+cid);
    if(bar)bar.style.width=(100*p.t/sec).toFixed(1)+'%';
    if(tc)tc.textContent=fmtT(p.t)+' / '+fmtT(sec);
    if(p.t>=sec){clearInterval(p.iv);p.iv=null;stage.classList.remove('playing');big.textContent='↻';}
  },400);
}

function paintPaper(){
  const paper=document.getElementById('pdf-paper');if(!paper)return;
  paper.style.fontSize=(13.5*VIEW.z).toFixed(1)+'px';
  paper.innerHTML=CURPAGES[VIEW.page]||'';

function repoField(r){const m=d(r.msc).match(/MSC\s*([0-9]{2}[A-Z]{0,2}[0-9]*)/);return m?m[1]:null;}

/* ================== Copilot ================== */
function toggleCopilot(open){document.getElementById('copilot').classList.toggle('open',open);if(open)document.getElementById('cp-q').focus();}
function cpLimit(){const u=USERS[S.cur];return u&&u.cpq!==undefined?u.cpq:10;}
function cpQuotaText(){
  const e=E(),q=cpLimit();
  if(q===Infinity)return e?'Copilot · unlimited':'Copilot · 不限次';
  return 'Copilot · '+(q-S.cp.n)+' / '+q+(e?' today':' 今日');
}
function updCpQuota(){const el=document.getElementById('cp-quota');if(el)el.textContent=cpQuotaText();}
function copilotSearch(){
  const e=E(),q=document.getElementById('cp-q').value.trim().toLowerCase(),b=document.getElementById('cp-body');
  const lim=cpLimit();
  if(!q){b.innerHTML=`<p class="small muted">${e?'Try: "center", "reflection equation", "Theorem 2.7", "open"':'试试：「中心」「反射方程」「定理 2.7」「未解决」'}</p>`;updCpQuota();return;}
  if(lim!==Infinity&&S.cp.n>=lim){
    b.innerHTML=`<div class="ai-item" style="border-color:var(--red)"><b>⛔ ${e?'Daily Copilot quota used up':'今日 Copilot 额度已用完'}</b><p class="small muted" style="margin-top:4px">${e?'Regular users get 10 precise theorem-level searches per day (edu-verified tiers get more). Resets at midnight.':'普通用户每天 10 次定理级精确检索（教育认证档位更高）。每日零点重置。'}</p></div>`;updCpQuota();return;}
  if(lim!==Infinity){S.cp.n++;save();updCpQuota();}
  const hits=[
    ...allRepos().flatMap(r=>{const T=THEOREMS[r.id];if(!T)return[];return T.thms.filter(t=>(d(t.tag)+' '+d(t.body)).toLowerCase().includes(q)).map(t=>({rt:(e?'Theorem · ':'定理 · ')+d(TYPE_LABEL[r.type]||r.type),rs:d(t.tag)+' — '+d(t.body).replace(/<[^>]+>/g,'').slice(0,100)+'…',go:'#/repo/'+r.id}));}),
    ...allRepos().filter(r=>(d(r.title)+' '+d(r.type)+' '+d(r.abs)+' '+d(r.msc)).toLowerCase().includes(q)).map(r=>({rt:e?'Repo · ':'仓库 · '+d(TYPE_LABEL[r.type]||r.type),rs:d(r.title)+(r.closed?(e?' (closed · co-signed publication)':'（已关闭 · 共同署名发表）'):''),go:'#/repo/'+r.id})),
    ...allIssues().filter(i=>!i.blocked&&(d(i.title)+' '+d(i.body)).toLowerCase().includes(q)).map(i=>({rt:e?'Problem card':'问题卡片',rs:d(i.title)+' — '+d(USERS[i.who]?USERS[i.who].name:i.who),go:'#/issues'})),
    ...Object.entries(USERS).filter(([k,u])=>d(u.name).toLowerCase().includes(q)||d(u.role).toLowerCase().includes(q)).map(([k,u])=>({rt:e?'User':'用户',rs:d(u.name)+' · '+d(u.role),go:'#/user/'+k}))
  ];
  const head=lim===Infinity?'':`<p class="small muted" style="margin:2px 0 8px">✦ ${e?'Precise theorem-level search over all articles & public problems':'对全部文章与公开问题的定理级精确检索'}${e?' · '+(lim-S.cp.n)+' left today':' · 今日剩余 '+(lim-S.cp.n)}</p>`;
  b.innerHTML=head+(hits.length?hits.map(h=>`<div class="res" onclick="toggleCopilot(false);location.hash='${h.go}'"><div class="rt">${h.rt}</div><div class="rs">${esc(h.rs)}</div></div>`).join(''):
  `<p class="small muted">${e?'No local hits. The live backend widens this to pure semantic recall (vector neighbors + keyword reranking).':'本地未命中。线上后端将放宽为纯语义召回（向量近邻 + 关键词重排）。'}</p>`);
}
